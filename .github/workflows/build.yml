name: Build reVC macOS Native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake glfw openal-soft mpg123 pkg-config

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          
          # Ask pkg-config where openal-soft includes and libs actually live
          OPENAL_CFLAGS=$(pkg-config --cflags openal)
          OPENAL_LIBS=$(pkg-config --libs openal)
          
          cmake \
            -D LIBRW_PLATFORM=GL3 \
            -D RE3_AUDIO=OPENAL \
            -D RE3_VENOM=ON \
            -D CMAKE_C_FLAGS="${OPENAL_CFLAGS} -I/opt/homebrew/include -I/usr/local/include" \
            -D CMAKE_CXX_FLAGS="${OPENAL_CFLAGS} -I/opt/homebrew/include -I/usr/local/include -std=c++11 -Wno-error" \
            -D CMAKE_EXE_LINKER_FLAGS="${OPENAL_LIBS}" \
            ..

      - name: Build reVC
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-macOS-executable
          path: build/bin/reVC
