name: Build reVC macOS Native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake glfw openal-soft mpg123

      - name: Fix OpenAL Header Paths for Clang
        run: |
          sudo mkdir -p /usr/local/include
          sudo cp -r /opt/homebrew/opt/openal-soft/include/AL /usr/local/include/
          cp -r /opt/homebrew/opt/openal-soft/include/AL src/

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake \
            -D LIBRW_PLATFORM=GL3 \
            -D CMAKE_CXX_FLAGS="-std=c++11 -Wno-error" \
            ..

      - name: Build reVC
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-macOS-executable
          path: build/bin/reVC
