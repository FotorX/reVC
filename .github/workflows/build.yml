name: Build reVC macOS Native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake glfw openal-soft mpg123 pkg-config

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake \
            -D LIBRW_PLATFORM=GL3 \
            -D RE3_AUDIO=OPENAL \
            -D RE3_VENOM=ON \
            -D OPENAL_INCLUDE_DIR=/opt/homebrew/opt/openal-soft/include \
            -D CMAKE_C_FLAGS="-I/opt/homebrew/opt/openal-soft/include -I/opt/homebrew/include" \
            -D CMAKE_CXX_FLAGS="-I/opt/homebrew/opt/openal-soft/include -I/opt/homebrew/include -std=c++11 -Wno-error" \
            ..

      - name: Build reVC
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-macOS-executable
          path: build/bin/reVC
